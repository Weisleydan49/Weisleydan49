<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hubEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c44bf0"/>
      <stop offset="50%" stop-color="#4f7dff"/>
      <stop offset="100%" stop-color="#1fe0c4"/>
    </linearGradient>
    <pattern id="hubGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1c2333" stroke-width="0.5"/>
    </pattern>
    <filter id="hubGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="158" rx="14" fill="#080b12"/>
  <rect x="1" y="1" width="898" height="158" rx="14" fill="url(#hubGrid)"/>
  <rect x="1" y="1" width="898" height="158" rx="14" fill="none" stroke="url(#hubEdge)" stroke-width="1.5" filter="url(#hubGlow)"/>

  <path d="M20 24 L20 14 L40 14" fill="none" stroke="#1fe0c4" stroke-width="1.5" filter="url(#hubGlow)"/>
  <path d="M880 24 L880 14 L860 14" fill="none" stroke="#c44bf0" stroke-width="1.5" filter="url(#hubGlow)"/>
  <path d="M20 136 L20 146 L40 146" fill="none" stroke="#c44bf0" stroke-width="1.5" filter="url(#hubGlow)"/>
  <path d="M880 136 L880 146 L860 146" fill="none" stroke="#1fe0c4" stroke-width="1.5" filter="url(#hubGlow)"/>

  <line x1="220" y1="42" x2="330" y2="42" stroke="#1fe0c4" stroke-width="1"/>
  <line x1="570" y1="42" x2="680" y2="42" stroke="#c44bf0" stroke-width="1"/>
  <text x="450" y="47" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#1fe0c4" filter="url(#hubGlow)">PRIMARY SYSTEM PORTAL</text>

  <text x="450" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f0f6fc">WEISLEY — BUILD HUB</text>
  <text x="450" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Cross-platform apps, back to front</text>

  <line x1="270" y1="128" x2="380" y2="128" stroke="#4f7dff" stroke-width="1"/>
  <line x1="520" y1="128" x2="630" y2="128" stroke="#4f7dff" stroke-width="1"/>
</svg>
