<svg width="900" height="50" viewBox="0 0 900 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="20" y1="25" x2="380" y2="25" stroke="#30363d" stroke-width="1"/>
  <line x1="520" y1="25" x2="880" y2="25" stroke="#30363d" stroke-width="1"/>

  <path d="M380 25 L395 12" stroke="#4f7dff" stroke-width="1"/>
  <path d="M520 25 L505 12" stroke="#4f7dff" stroke-width="1"/>

  <rect x="400" y="14" width="100" height="22" rx="11" fill="#080b12" stroke="#30363d"/>

  <circle cx="425" cy="25" r="3" fill="#c44bf0">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="25" r="3" fill="#4f7dff">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="475" cy="25" r="3" fill="#1fe0c4">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <circle r="3.5" fill="#1fe0c4" filter="url(#dGlow)">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M20,25 L380,25 M520,25 L880,25 M20,25"/>
  </circle>
</svg>
