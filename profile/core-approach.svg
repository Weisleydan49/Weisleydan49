  <rect x="0" y="0" width="5" height="180" rx="2" fill="#c44bf0" filter="url(#glow3)"/>
  <text x="26" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">How I Work</text>
